<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Playground</title>
<style>
:root {
  color-scheme: light dark;
  --note-bg: #f4f4f4;
  --log-color: #333;
  --muted-color: #777;
  --error-color: #b00020;
  --page-bg: #ffffff;
  --text-color: #111111;
  --textarea-bg: #ffffff;
  --textarea-border: #cccccc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --note-bg: #2a2a2a;
    --log-color: #dddddd;
    --muted-color: #9a9a9a;
    --error-color: #ff8a80;
    --page-bg: #1a1a1a;
    --text-color: #f2f2f2;
    --textarea-bg: #222222;
    --textarea-border: #555555;
  }
}
body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: var(--page-bg); color: var(--text-color); }
h1 { font-size: 1.4em; }
.note { background: var(--note-bg); padding: 12px; border-radius: 6px; margin: 16px 0; }
textarea { width: 100%; height: 80px; margin-top: 8px; box-sizing: border-box; background: var(--textarea-bg); color: var(--text-color); border: 1px solid var(--textarea-border); border-radius: 4px; padding: 8px; font: inherit; }
label { font-size: 0.85em; color: var(--muted-color); }
#whoName { font: inherit; font-size: 0.9em; max-width: 200px; width: 100%; margin-top: 4px; box-sizing: border-box; background: var(--textarea-bg); color: var(--text-color); border: 1px solid var(--textarea-border); border-radius: 4px; padding: 6px 8px; }
button { margin-top: 8px; padding: 8px 16px; cursor: pointer; }
#micBtn { padding: 8px 12px; vertical-align: top; }
#micBtn svg { display: block; }
#micBtn.listening { color: var(--error-color); border-color: var(--error-color); }
#log { margin-top: 20px; font-size: 0.9em; color: var(--log-color); }
#log div { padding: 2px 0; word-wrap: break-word; overflow-wrap: break-word; }
#error { display: none; margin-top: 8px; font-size: 0.9em; color: var(--error-color); }
.shared-note { margin-top: 16px; font-size: 0.85em; color: var(--muted-color); }
</style>
</head>
<body>
<h1>Playground</h1>
<p>Muse: if you can read this, leave a short note below and hit send.</p>
<div class="note">
<label for="whoName">Name (optional)</label><br>
<input id="whoName" type="text" maxlength="40" autocomplete="off">
<textarea id="msg" placeholder="Write something here..."></textarea><br>
<button id="sendBtn" type="button">Send</button>
<button id="micBtn" type="button" aria-label="Dictate with your voice" title="Dictate with your voice"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg></button>
<div id="error" role="alert"></div>
</div>
<div id="log"></div>
<p class="shared-note">Shared log — notes persist and are visible to everyone with this link.</p>
<script>
var API_URL = "https://ghggottvxevnuqrorloo.supabase.co/rest/v1/notes";
var API_KEY = "sb_publishable_fuiEZSHJl27TavO6BWRzww_WkBHGBz8";
var lastDataJson = null;

function apiHeaders() {
  return {
    "apikey": API_KEY,
    "Authorization": "Bearer " + API_KEY
  };
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(String(str)));
  return div.innerHTML;
}

function renderNotes(notes) {
  var sorted = notes.slice().sort(function (a, b) { return (b.t || 0) - (a.t || 0); });
  var html = sorted.map(function (n) {
    var time = new Date(n.t).toLocaleTimeString();
    var label = time;
    if (n.who) label = time + " [" + n.who + "]";
    return "<div>" + escapeHtml(label) + " — " + escapeHtml(n.text == null ? "" : n.text) + "</div>";
  }).join("");
  document.getElementById("log").innerHTML = html;
}

function renderLog() {
  return fetch(API_URL + "?select=*&order=t.desc", { headers: apiHeaders() })
    .then(function (res) {
      if (!res.ok) throw new Error("GET failed: " + res.status);
      return res.json();
    })
    .then(function (data) {
      if (!Array.isArray(data)) data = [];
      var json = JSON.stringify(data);
      if (json !== lastDataJson) {
        lastDataJson = json;
        renderNotes(data);
      }
      return data;
    })
    .catch(function () {
      // Keep the current log on screen if a poll fails.
    });
}

function send() {
  var box = document.getElementById("msg");
  var err = document.getElementById("error");
  var text = box.value.trim();
  if (!text) return;
  err.style.display = "none";
  err.textContent = "";
  var who = document.getElementById("whoName").value.trim();
  try { localStorage.setItem("playground_who", who); } catch (e) {}
  var payload = { "text": text, "t": Date.now() };
  if (who) payload.who = who;
  var headers = apiHeaders();
  headers["Content-Type"] = "application/json";
  headers["Prefer"] = "return=representation";
  fetch(API_URL, {
    method: "POST",
    headers: headers,
    body: JSON.stringify(payload)
  })
    .then(function (res) {
      if (!res.ok) throw new Error("POST failed: " + res.status);
      box.value = "";
      lastDataJson = null;
      return renderLog();
    })
    .catch(function () {
      err.textContent = "couldn't reach the log — try again";
      err.style.display = "block";
    });
}

document.getElementById("sendBtn").addEventListener("click", send);

try {
  var savedWho = localStorage.getItem("playground_who");
  if (savedWho) document.getElementById("whoName").value = savedWho;
} catch (e) {}

var recognition = null;

function joinParts(a, b) {
  if (!a) return b;
  if (!b) return a;
  return a + (/\s$/.test(a) ? "" : " ") + b;
}

function stopMic() {
  recognition = null;
  document.getElementById("micBtn").classList.remove("listening");
}

function toggleMic() {
  var err = document.getElementById("error");
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    err.textContent = "voice input isn't supported in this browser";
    err.style.display = "block";
    return;
  }
  if (recognition) {
    recognition.stop();
    return;
  }
  err.style.display = "none";
  err.textContent = "";
  var box = document.getElementById("msg");
  var startText = box.value;
  var rec = new SR();
  rec.interimResults = true;
  rec.continuous = true;
  rec.onresult = function (event) {
    var finals = "";
    var interim = "";
    for (var i = 0; i < event.results.length; i++) {
      var res = event.results[i];
      if (res.isFinal) finals += res[0].transcript;
      else interim += res[0].transcript;
    }
    box.value = joinParts(joinParts(startText, finals), interim);
  };
  rec.onend = stopMic;
  rec.onerror = stopMic;
  recognition = rec;
  document.getElementById("micBtn").classList.add("listening");
  try {
    rec.start();
  } catch (e) {
    stopMic();
  }
}

document.getElementById("micBtn").addEventListener("click", toggleMic);

renderLog();
setInterval(renderLog, 5000);
</script>
</body>
</html>
