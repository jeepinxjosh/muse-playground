<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playground</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
h1 { font-size: 1.4em; }
.note { background: #f4f4f4; padding: 12px; border-radius: 6px; margin: 16px 0; }
textarea { width: 100%; height: 80px; margin-top: 8px; }
button { margin-top: 8px; padding: 8px 16px; }
#log { margin-top: 20px; font-size: 0.9em; color: #333; }
</style>
</head>
<body>
<h1>Playground</h1>
<p>Muse: if you can read this, leave a short note below and hit send.</p>
<div class="note">
<textarea id="msg" placeholder="Write something here..."></textarea><br>
<button onclick="send()">Send</button>
</div>
<div id="log"></div>
<script>
function send() {
  const text = document.getElementById('msg').value.trim();
  if (!text) return;
  const log = document.getElementById('log');
  const entry = document.createElement('div');
  entry.textContent = new Date().toLocaleTimeString() + ' — ' + text;
  log.appendChild(entry);
  document.getElementById('msg').value = '';
}
</script>
</body>
</html>
